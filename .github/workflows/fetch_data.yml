name: Refresh prices.csv

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Startdatum (YYYY-MM-DD)'
        default: '2010-01-01'
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet yfinance pandas

      - name: Fetch prices
        env:
          START: ${{ inputs.start }}
        run: |
          python - <<'PY'
          import os, pandas as pd, yfinance as yf

          start = os.environ['START']
          # (naam_uitvoer, [kandidaat-tickers])
          targets = [
              ('prices.csv', ['MSE.PA', 'MSE.MI', 'LYSX.DE', 'LYSX.F']),   # Euro Stoxx 50 ETF
              ('prices_spy.csv', ['SPY']),                                  # S&P 500 ETF (USD)
              ('prices_qqq.csv', ['QQQ']),                                  # Nasdaq 100 ETF (USD)
          ]

          for out_name, tickers in targets:
              written = False
              for t in tickers:
                  df = yf.download(t, start=start, auto_adjust=True, progress=False)
                  if df is None or df.empty:
                      print(f'{t}: geen data')
                      continue
                  close = df['Close']
                  if isinstance(close, pd.DataFrame):
                      close = close.iloc[:, 0]
                  close = close.dropna()
                  if not len(close):
                      continue
                  out = close.rename('Close').reset_index()
                  out.columns = ['Date', 'Close']
                  out['Date'] = pd.to_datetime(out['Date']).dt.strftime('%Y-%m-%d')
                  out.to_csv(out_name, index=False)
                  print(f'{t}: {len(out)} rijen -> {out_name}')
                  written = True
                  break
              if not written:
                  print(f'{out_name}: geen enkele ticker lukt, sla over')
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.csv prices_spy.csv prices_qqq.csv 2>/dev/null || true
          git diff --cached --quiet && echo "geen wijzigingen" && exit 0
          git commit -m "data: refresh prices via Actions"
          git push
